<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House of Longevity — Threshold Transition Prototype</title>
<style>
  :root{
    --bg:#0A0908;
    --room1-glow:#F4E9D8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:#EDE9E2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
  #controls{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:rgba(10,9,8,.92);backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,.12);
    padding:10px 12px;font-size:11px;line-height:1.5;
  }
  #controls .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  #controls .row:last-child{margin-bottom:0;}
  #controls label{color:#B8B2A8;letter-spacing:.03em;}
  #controls select,#controls button{
    background:#1D1A16;color:#EDE9E2;border:1px solid #3B352D;border-radius:6px;
    padding:5px 8px;font-size:11px;
  }
  #controls button.active{background:#8A6A3A;border-color:#C89A5A;color:#fff;}
  #controls .badge{color:#D9A860;font-weight:700;}
  #skip{
    position:fixed;right:14px;bottom:14px;z-index:50;
    background:rgba(20,18,15,.85);border:1px solid rgba(255,255,255,.25);
    color:#EDE9E2;border-radius:999px;padding:10px 16px;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
  }
  #reduced-notice{
    position:fixed;left:0;right:0;bottom:0;z-index:50;text-align:center;
    background:rgba(20,18,15,.9);color:#B8B2A8;font-size:10.5px;padding:6px;
    display:none;letter-spacing:.04em;
  }
  .stage{position:relative;height:100vh;overflow:hidden;}
  .sticky{position:sticky;top:0;height:100vh;overflow:hidden;}
  .layer{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform,opacity;}
  .scrim{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.55));}
  .hero-copy{position:absolute;left:0;right:0;bottom:9%;padding:0 6%;z-index:2;}
  .kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#D8D2C7;opacity:.85;}
  .h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(28px,7vw,52px);margin:.25em 0 .1em;font-weight:600;}
  .h1 i{font-style:italic;font-weight:400;opacity:.9;}
  .enter{position:absolute;right:6%;bottom:9%;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#D8D2C7;z-index:2;}
  .black-hold{position:absolute;inset:0;background:#000;z-index:5;}
  .glow{position:absolute;inset:0;z-index:4;background:radial-gradient(ellipse at 50% 45%, rgba(244,233,216,0.0) 0%, rgba(244,233,216,0.0) 100%);}
  .room-copy{position:absolute;left:0;right:0;bottom:9%;padding:0 6%;z-index:2;}
  .spacer{height:100vh;}
  .measure{position:fixed;left:8px;top:56px;z-index:49;font-size:9.5px;color:#7A756B;background:rgba(20,18,15,.7);padding:4px 7px;border-radius:5px;font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion: reduce){
    .sticky{position:relative !important;}
  }
</style>
</head>
<body>

<div id="controls">
  <div class="row">
    <label>Black hold length:</label>
    <button data-hold="0">0vh</button>
    <button data-hold="10">10vh</button>
    <button data-hold="20" class="active">20vh</button>
    <button data-hold="35">35vh</button>
  </div>
  <div class="row">
    <label>Pin during black:</label>
    <button data-pin="0" class="active">No pin</button>
    <button data-pin="1">Pin</button>
    <label style="margin-left:14px;">Glow timing:</label>
    <button data-glow="late" class="active">Glow after black</button>
    <button data-glow="early">Glow starts before pure black</button>
  </div>
  <div class="row">
    <label>Motion:</label>
    <button data-motion="full" class="active">Full parallax</button>
    <button data-motion="reduced">Reduced motion (crossfade only)</button>
    <span class="badge" id="statusline"></span>
  </div>
</div>

<div id="reduced-notice">prefers-reduced-motion detected on this device — showing simple crossfade fallback automatically</div>
<div class="measure" id="measure">t=0.00</div>

<!-- SCENE 1: HERO -->
<section class="stage" id="hero-stage">
  <div class="sticky">
    <div class="layer" id="l-gravel" style="background-image:url('assets/door.jpg')"></div>
    <div class="scrim"></div>
    <div class="hero-copy">
      <div class="kicker">The premium Australian longevity clinic</div>
      <div class="h1">Welcome to<br>the House.</div>
    </div>
    <div class="enter">Enter</div>
  </div>
</section>
<div class="spacer" id="push-spacer"></div>

<!-- SCENE 2: THRESHOLD (black hold + glow) -->
<section class="stage" id="threshold-stage">
  <div class="sticky">
    <div class="black-hold" id="black"></div>
    <div class="glow" id="glow"></div>
  </div>
</section>
<div class="spacer" id="hold-spacer"></div>

<!-- SCENE 3: ROOM ONE ARRIVES -->
<section class="stage" id="room-stage">
  <div class="sticky">
    <div class="layer" id="l-room1" style="background-image:url('assets/room1.jpg')"></div>
    <div class="scrim"></div>
    <div class="room-copy">
      <div class="kicker">Cosmetic Quarter</div>
      <div class="h1">The pool hall.</div>
    </div>
  </div>
</section>
<div class="spacer" style="height:60vh;"></div>

<a href="#membership" id="skip">Skip to membership</a>
<section class="stage" id="membership" style="height:60vh;">
  <div style="display:flex;align-items:center;justify-content:center;height:100%;padding:0 8%;text-align:center;">
    <div>
      <div class="kicker">Membership</div>
      <div class="h1" style="font-size:clamp(22px,5vw,34px);">This is where the real page continues.</div>
    </div>
  </div>
</section>

<script>
(function(){
  var state = { hold: 20, pin: 0, glow: 'late', motion: 'full' };

  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  function applyReducedDefault(){
    if (reduceMQ.matches) {
      state.motion = 'reduced';
      document.querySelectorAll('[data-motion]').forEach(function(b){ b.classList.toggle('active', b.dataset.motion === 'reduced'); });
      document.getElementById('reduced-notice').style.display = 'block';
    }
  }
  applyReducedDefault();

  document.querySelectorAll('#controls button[data-hold]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('[data-hold]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.hold = parseInt(btn.dataset.hold, 10);
      layoutSpacers();
    });
  });
  document.querySelectorAll('#controls button[data-pin]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('[data-pin]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.pin = parseInt(btn.dataset.pin, 10);
    });
  });
  document.querySelectorAll('#controls button[data-glow]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('[data-glow]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.glow = btn.dataset.glow;
    });
  });
  document.querySelectorAll('#controls button[data-motion]').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('[data-motion]').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.motion = btn.dataset.motion;
    });
  });

  // URL param overrides on load: ?hold=35&pin=1&glow=early&motion=reduced
  var params = new URLSearchParams(location.search);
  if (params.has('hold')) state.hold = parseInt(params.get('hold'),10);
  if (params.has('pin')) state.pin = parseInt(params.get('pin'),10);
  if (params.has('glow')) state.glow = params.get('glow');
  if (params.has('motion')) state.motion = params.get('motion');

  var pushSpacer = document.getElementById('push-spacer');
  var holdSpacer = document.getElementById('hold-spacer');
  var black = document.getElementById('black');
  var glow = document.getElementById('glow');
  var lGravel = document.getElementById('l-gravel');
  var lRoom1 = document.getElementById('l-room1');
  var statusline = document.getElementById('statusline');
  var measure = document.getElementById('measure');

  function vh(v){ return (v/100) * window.innerHeight; }

  function layoutSpacers(){
    // push spacer: fixed distance for the door-push beat
    pushSpacer.style.height = '70vh';
    // hold spacer: honors the exact chosen vh, including a literal 0 (instant cut, no black frame held)
    holdSpacer.style.height = state.hold + 'vh';
    statusline.textContent = 'hold=' + state.hold + 'vh pin=' + (state.pin ? 'ON' : 'off') + ' glow=' + state.glow + ' motion=' + state.motion;
  }
  layoutSpacers();

  function clamp01(x){ return Math.max(0, Math.min(1, x)); }

  function onScroll(){
    var y = window.scrollY;
    var vhpx = window.innerHeight;

    // ---- Scene 1: push toward the door ----
    var heroStage = document.getElementById('hero-stage');
    var heroTop = heroStage.offsetTop;
    var pushDist = vh(70);
    var pushProgress = clamp01((y - heroTop) / pushDist);

    if (state.motion === 'reduced') {
      // simple crossfade only, no scale/translate parallax
      lGravel.style.transform = 'none';
      lGravel.style.opacity = String(1 - pushProgress);
    } else {
      var scale = 1 + pushProgress * 0.45;
      lGravel.style.transform = 'scale(' + scale.toFixed(3) + ')';
      lGravel.style.opacity = String(1 - Math.max(0, pushProgress - 0.6) * 2.5);
    }

    // ---- Scene 2: threshold black + glow ----
    var thresholdStage = document.getElementById('threshold-stage');
    var thTop = thresholdStage.offsetTop;
    var holdDistPx = Math.max(vh(state.hold), 1); // avoid div-by-zero at hold=0
    var thProgress = clamp01((y - thTop) / holdDistPx);

    // black opacity: at hold=0 there is still one instant frame of black (a hard cut with
    // a black flash, not a held black) so the cut never reads as a jarring pop; at hold>0
    // it holds fully opaque black for the whole zone.
    var blackOpacity;
    if (state.hold === 0) {
      blackOpacity = thProgress < 0.5 ? 1 : 0;
    } else {
      blackOpacity = 1;
    }
    black.style.opacity = String(blackOpacity);

    // glow timing: 'late' = only appears after black is mostly settled; 'early' = glow starts rising immediately, black never reads as pure/total
    var glowStart = state.glow === 'early' ? 0.15 : 0.7;
    var glowT = clamp01((thProgress - glowStart) / (1 - glowStart));
    var glowAlpha = state.glow === 'early' ? (0.05 + glowT * 0.5) : (glowT * 0.6);
    if (state.glow === 'early') {
      glow.style.background = 'radial-gradient(ellipse at 50% 48%, rgba(244,233,216,' + glowAlpha.toFixed(3) + ') 0%, rgba(244,233,216,0) 62%)';
    } else {
      glow.style.background = 'radial-gradient(ellipse at 50% 48%, rgba(244,233,216,' + glowAlpha.toFixed(3) + ') 0%, rgba(244,233,216,0) 55%)';
    }

    // ---- Scene 3: room one arrives ----
    // Room fade-in begins ONLY once the threshold zone (black hold, in full) has actually
    // been scrolled past -- not a viewport-height early, which previously let the incoming
    // room bleed through the tail of the black hold uncontrolled. roomZoneStart is the exact
    // scroll position where threshold-stage + its hold-spacer ends.
    var roomStage = document.getElementById('room-stage');
    var roomZoneStart = thTop + vhpx + vh(state.hold);
    var roomDist = vh(60);
    var roomProgress = clamp01((y - roomZoneStart) / roomDist);
    lRoom1.style.opacity = String(clamp01(roomProgress * 1.4));
    if (state.motion !== 'reduced') {
      lRoom1.style.transform = 'scale(' + (1.08 - roomProgress*0.08).toFixed(3) + ')';
    } else {
      lRoom1.style.transform = 'none';
    }

    measure.textContent = 'push t=' + pushProgress.toFixed(2) + '  threshold t=' + thProgress.toFixed(2) + '  room t=' + roomProgress.toFixed(2);
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', layoutSpacers);
  onScroll();

  // ---- Real pin implementation ----
  // When pin=1, entering the black-hold zone captures wheel/touch input for a short,
  // fixed real-world duration (not tied to scroll distance) so the visitor cannot scroll
  // past the black no matter how fast they scroll. Releases automatically after PIN_MS.
  var PIN_MS = 550;
  var pinActive = false;
  var pinReleaseTimer = null;
  var pinEnteredScrollY = 0;

  function inThresholdZone(y){
    var thresholdStage = document.getElementById('threshold-stage');
    var top = thresholdStage.offsetTop;
    var bottom = top + thresholdStage.offsetHeight + vh(Math.max(state.hold, 8));
    return y >= top - vh(5) && y <= bottom;
  }

  function tryEnterPin(){
    if (state.pin !== 1 || pinActive) return;
    if (!inThresholdZone(window.scrollY)) return;
    pinActive = true;
    pinEnteredScrollY = window.scrollY;
    document.body.style.overflow = 'hidden';
    clearTimeout(pinReleaseTimer);
    pinReleaseTimer = setTimeout(function(){
      pinActive = false;
      document.body.style.overflow = '';
    }, PIN_MS);
  }

  function blockDuringPin(e){
    if (pinActive) { e.preventDefault(); }
  }

  window.addEventListener('wheel', function(e){
    if (state.pin === 1 && !pinActive && inThresholdZone(window.scrollY)) {
      tryEnterPin();
    }
    blockDuringPin(e);
  }, { passive: false });

  window.addEventListener('touchmove', function(e){
    if (state.pin === 1 && !pinActive && inThresholdZone(window.scrollY)) {
      tryEnterPin();
    }
    blockDuringPin(e);
  }, { passive: false });
})();
</script>
</body>
</html>
